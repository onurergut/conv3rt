name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        # Optional libjxl and libavif codecs are not built in CI, so their write
        # tests skip. Everything else runs.
        run: swift test --enable-code-coverage

      - name: Coverage summary
        # Report only — no threshold, so the build never fails on a number.
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          xcrun llvm-cov report \
            "$BIN_PATH/conv3rtPackageTests.xctest/Contents/MacOS/conv3rtPackageTests" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            Sources Tests

      - name: Capability matrix still generates
        run: swift run conv3rt --dump-capabilities > /dev/null
